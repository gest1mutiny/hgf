name: 🎛️ Mutiny TV - Normalizador Elástico de ADN Multimedia

on:
  workflow_dispatch: # Permite gatillarlo manual o por relevos desde el Ladrón
    inputs:
      archivo_blanco:
        description: 'Nombre del archivo .mp4 a rescatar de la Release'
        required: true
        default: 'estreno_mutiny.mp4'

permissions:
  contents: write
  actions: write

jobs:
  normalizar_video:
    runs-on: ubuntu-latest
    steps:
      - name: 🗄️ Inicializando espacio de procesamiento
        uses: actions/checkout@v4

      - name: ⚙️ Instalación Directa de FFmpeg Nativo
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl jq

      - name: 🛠️ Succión desde Release, Moldeado de Titanio y Re-Inyección Smart Split por Peso
        run: |
          # 🪓 [REACTOR DE RELEVOS v4.0 - DIEGO SEGMENT WEIGHT CORE]
          export TERM=xterm
          TARGET="${{ github.event.inputs.archivo_blanco }}"
          
          echo "📥 FASE 1: Descargando fideo crudo desde tu propio cofre seguro..."
          gh release download bunker_mutiny -p "$TARGET" || true

          if [ ! -s "$TARGET" ]; then
            echo "❌ No encontré el archivo $TARGET en las Releases. Abortando flete."
            exit 1
          fi

          echo "📥 FASE 2: Aplicando el Molde de Titanio al archivo local en frío absolute..."
          ffmpeg -y -i "$TARGET" \
            -filter_complex "[0:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,setsar=1:1[v_moldeado]" \
            -map "[v_moldeado]" -map 0:a:0? -r 30 -pix_fmt yuv420p \
            -c:v libx264 -preset ultrafast -crf 22 -g 60 -keyint_min 60 \
            -c:a aac -b:a 128k -ac 2 -ar 44100 -async 1 "masterizado_temp.mp4"

          # Purgamos el fideo crudo viejo para liberar el almacenamiento virtual
          rm -f "$TARGET"

          # 🧠 SENSOR DE PESO BIÓNICO POR FRACCIONAMIENTO ESTRICTO DE ME_G_A_S
          PESO_BYTES=$(stat -c%s "masterizado_temp.mp4")
          LIMITE_BYTES=2000000000 # 2 GB rígidos de aduana de la API
          
          BASE_NAME="${TARGET%.mp4}"

          if [ $PESO_BYTES -gt $LIMITE_BYTES ]; then
            echo "⚠️ [ALERTA DE HARDWARE] El video final pesa $(du -sh masterizado_temp.mp4 | awk '{print $1}'), superando el límite de 2 GB."
            echo "✂️ Activando guillotina inteligente por peso a bloques estrictos de 1.9 GB..."

            # 🧠 EL REMACHE MAESTRO DE DIEGO: Usamos el segmentador nativo por tamaño de archivo.
            # -segment_size 1900M -> Cierra el archivo y abre el otro estrictamente al tocar los 1900 MB de disco.
            # %d -> Genera los nombres en fila india (0, 1, etc.) para que la consola los bueyee de novela.
            ffmpeg -i masterizado_temp.mp4 -c copy -map 0 \
                   -f segment -segment_size 1900M -reset_timestamps 1 "${BASE_NAME}_part_%d.mp4"

            # Limpiamos la lona de la RAM virtual borrando el residuo gigante
            rm -f masterizado_temp.mp4

            # 🧠 RE-CALIBRACIÓN RÍGIDA DE NOMBRES SEGÚN TU LEY DE BOXES:
            # Traducimos los nombres del segmentador (part_0, part_1) a tu formato clásico unificado:
            # El pedazo 0 se queda con el nombre original limpio. El pedazo 1 se queda con tu distintivo _2.mp4
            if [ -f "${BASE_NAME}_part_0.mp4" ]; then
               mv "${BASE_NAME}_part_0.mp4" "$TARGET"
            fi
            if [ -f "${BASE_NAME}_part_1.mp4" ]; then
               mv "${BASE_NAME}_part_1.mp4" "${BASE_NAME}_2.mp4"
            fi
            if [ -f "${BASE_NAME}_part_2.mp4" ]; then
               mv "${BASE_NAME}_part_2.mp4" "${BASE_NAME}_3.mp4"
            fi

            echo "💾 FASE 3: Inyectando las partes divididas estrictamente por peso al cofre..."
            gh release upload bunker_mutiny *.mp4 --clobber
            
            echo "✅ Guillotina molecular por peso ejecutada con éxito absoluto."
            ls -lh *.mp4
          else
            echo "🟢 [HARDWARE SALUDABLE] El archivo mide menos de 2 GB."
            mv masterizado_temp.mp4 "$TARGET"
            
            echo "💾 FASE 3: Sobreescribiendo el archivo limpio de forma entera..."
            gh release upload bunker_mutiny "$TARGET" --clobber
          fi

          echo "🏁 [MUTINY TV] Relevo por peso completado. El estante quedó lacrado."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
